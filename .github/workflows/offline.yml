name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-and-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # verified upstream commit
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # verified upstream commit
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_public_tree.py
      - run: python scripts/check_versions.py
      - run: python scripts/check_lua_only.py
      - run: python scripts/validate_source.py
      - run: python scripts/validate_lua_source.py
      - run: python tests/test_lua_only.py
      - run: python tests/test_versioning.py
      - run: python tests/test_mp_test_build.py
      - run: python tests/run_route_work.py
